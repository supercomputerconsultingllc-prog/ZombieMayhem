# Select this config in Codemagic. Configure the named integration and signing
# identity there; no credentials belong in .env files or release artifacts.
workflows:
  zombie-mayhem-testflight:
    name: Zombie Mayhem V2 TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: zombie-mayhem-apple
    environment:
      xcode: 26.6
      node: 24
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.zombiesquadrun.game
    scripts:
      - name: Validate game and dependencies
        script: |
          set -euo pipefail
          npm ci
          npm audit --audit-level=high
          npm run validate
          npm run test:unit
          npm run test:soak
          npx playwright install chromium webkit
          CROSS_BROWSER=1 npx playwright test --project=desktop-chromium --project=mobile-webkit
      - name: Prepare pinned offline V2 native project
        script: |
          set -euo pipefail
          cd apps/zombie-squad-run-ios-webwrap
          npm ci
          npm audit --audit-level=high
          node tools/check-xcode.js
          export ZOMBIE_BUILD_NUMBER="$((BUILD_NUMBER + 1))"
          npm run prepare:ios
          node tools/verify-v2.js --release
      - name: Sign and archive
        script: |
          set -euo pipefail
          cd apps/zombie-squad-run-ios-webwrap
          xcode-project use-profiles
          xcode-project build-ipa --project ios/App/App.xcodeproj --scheme App
          node tools/verify-app.js build/ios/xcarchive/App.xcarchive/Products/Applications/App.app
    artifacts:
      - apps/zombie-squad-run-ios-webwrap/build/ios/ipa/*.ipa
      - apps/zombie-squad-run-ios-webwrap/build/ios/xcarchive/*.xcarchive/dSYMs/**
      - apps/zombie-squad-run-ios-webwrap/web/build-manifest.json
      - apps/zombie-squad-run-ios-webwrap/ios/App/App.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
